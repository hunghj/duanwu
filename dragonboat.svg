<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Top Dragon Boat -->
  <g id="top-boat">
    <!-- Water -->
    <path d="M 50 350 Q 100 360 150 350 T 250 350 T 350 350 T 450 350 T 550 350 T 650 350 T 750 350 T 850 350 T 950 350 L 950 400 Q 900 390 850 400 T 750 400 T 650 400 T 550 400 T 450 400 T 350 400 T 250 400 T 150 400 T 50 400 Z" fill="#87CEEB" opacity="0.6"/>
    
    <!-- Dragon Head -->
    <ellipse cx="200" cy="280" rx="80" ry="90" fill="#2D7A4A"/>
    <!-- Snout -->
    <ellipse cx="140" cy="280" rx="50" ry="60" fill="#2D7A4A"/>
    <!-- Mouth -->
    <path d="M 120 270 Q 100 260 90 270" stroke="#8B0000" stroke-width="8" fill="none"/>
    <path d="M 120 290 Q 100 300 90 290" stroke="#8B0000" stroke-width="8" fill="none"/>
    <!-- Teeth -->
    <rect x="85" y="265" width="8" height="10" fill="white"/>
    <rect x="95" y="260" width="8" height="15" fill="white"/>
    <!-- Eye -->
    <circle cx="180" cy="260" r="15" fill="white"/>
    <circle cx="180" cy="260" r="10" fill="black"/>
    <!-- Horns -->
    <path d="M 220 200 Q 260 150 280 120" stroke="#FFD700" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 240 180 Q 290 120 320 80" stroke="#FFD700" stroke-width="20" fill="none" stroke-linecap="round"/>
    
    <!-- Boat Body -->
    <ellipse cx="400" cy="320" rx="250" ry="80" fill="#2D7A4A"/>
    <!-- Boat outline -->
    <path d="M 150 320 Q 200 280 400 280 Q 600 280 650 320 Q 600 360 400 360 Q 200 360 150 320" fill="#1a5a3a" opacity="0.5"/>
    
    <!-- Rowers -->
    <!-- Person 1 -->
    <circle cx="280" cy="240" r="25" fill="#FDB462"/>
    <rect x="265" y="270" width="30" height="50" fill="#DC143C"/>
    <rect x="260" y="270" width="40" height="20" fill="#FF6347"/>
    <line x1="280" y1="270" x2="270" y2="330" stroke="#8B4513" stroke-width="8"/>
    <line x1="280" y1="270" x2="290" y2="330" stroke="#8B4513" stroke-width="8"/>
    <!-- Oar 1 -->
    <line x1="270" y1="330" x2="180" y2="380" stroke="#8B4513" stroke-width="12"/>
    
    <!-- Person 2 -->
    <circle cx="400" cy="240" r="25" fill="#FDB462"/>
    <rect x="385" y="270" width="30" height="50" fill="#DC143C"/>
    <rect x="380" y="270" width="40" height="20" fill="#FF6347"/>
    <line x1="400" y1="270" x2="390" y2="330" stroke="#8B4513" stroke-width="8"/>
    <line x1="400" y1="270" x2="410" y2="330" stroke="#8B4513" stroke-width="8"/>
    <!-- Oar 2 -->
    <line x1="390" y1="330" x2="400" y2="390" stroke="#8B4513" stroke-width="12"/>
    
    <!-- Person 3 -->
    <circle cx="520" cy="240" r="25" fill="#FDB462"/>
    <rect x="505" y="270" width="30" height="50" fill="#DC143C"/>
    <rect x="500" y="270" width="40" height="20" fill="#FF6347"/>
    <line x1="520" y1="270" x2="510" y2="330" stroke="#8B4513" stroke-width="8"/>
    <line x1="520" y1="270" x2="530" y2="330" stroke="#8B4513" stroke-width="8"/>
    <!-- Oar 3 -->
    <line x1="510" y1="330" x2="620" y2="380" stroke="#8B4513" stroke-width="12"/>
  </g>
  
  <!-- Bottom Dragon Boat -->
  <g id="bottom-boat" transform="translate(0, 300)">
    <!-- Dragon Head Red -->
    <ellipse cx="750" cy="280" rx="80" ry="90" fill="#DC143C"/>
    <!-- Yellow belly -->
    <ellipse cx="750" cy="300" rx="60" ry="70" fill="#FFD700"/>
    <!-- Snout -->
    <ellipse cx="820" cy="280" rx="50" ry="60" fill="#DC143C"/>
    <!-- Eye -->
    <circle cx="780" cy="260" r="15" fill="white"/>
    <circle cx="780" cy="260" r="10" fill="black"/>
    <!-- Teeth -->
    <rect x="840" y="265" width="8" height="10" fill="white"/>
    <rect x="830" y="260" width="8" height="15" fill="white"/>
    <!-- Horns/Mane -->
    <path d="M 730 200 Q 690 150 670 120" stroke="#FFD700" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 710 180 Q 660 120 640 80" stroke="#FFD700" stroke-width="20" fill="none" stroke-linecap="round"/>
    
    <!-- Boat Body Red -->
    <ellipse cx="500" cy="320" rx="250" ry="80" fill="#DC143C"/>
    <!-- Yellow trim -->
    <ellipse cx="500" cy="330" rx="240" ry="30" fill="#FFD700"/>
    
    <!-- Rowers in Zongzi wrapping -->
    <!-- Person 1 -->
    <rect x="330" y="260" width="60" height="80" rx="10" fill="#2D7A4A"/>
    <circle cx="360" cy="250" r="25" fill="#FDB462"/>
    <!-- Face -->
    <circle cx="355" cy="245" r="4" fill="black"/>
    <circle cx="365" cy="245" r="4" fill="black"/>
    <!-- Smile -->
    <path d="M 355 250 Q 360 255 365 250" stroke="black" stroke-width="2" fill="none"/>
    <!-- Red paddle -->
    <rect x="340" y="345" width="15" height="60" fill="#DC143C" rx="7"/>
    
    <!-- Person 2 -->
    <rect x="480" y="260" width="60" height="80" rx="10" fill="#2D7A4A"/>
    <circle cx="510" cy="250" r="25" fill="#FDB462"/>
    <!-- Face -->
    <circle cx="505" cy="245" r="4" fill="black"/>
    <circle cx="515" cy="245" r="4" fill="black"/>
    <!-- Smile -->
    <path d="M 505 250 Q 510 255 515 250" stroke="black" stroke-width="2" fill="none"/>
    <!-- Red paddle -->
    <rect x="490" y="345" width="15" height="60" fill="#DC143C" rx="7"/>
    
    <!-- Person 3 -->
    <rect x="630" y="260" width="60" height="80" rx="10" fill="#2D7A4A"/>
    <circle cx="660" cy="250" r="25" fill="#FDB462"/>
    <!-- Face -->
    <circle cx="655" cy="245" r="4" fill="black"/>
    <circle cx="665" cy="245" r="4" fill="black"/>
    <!-- Smile -->
    <path d="M 655 250 Q 660 255 665 250" stroke="black" stroke-width="2" fill="none"/>
    <!-- Red paddle -->
    <rect x="640" y="345" width="15" height="60" fill="#DC143C" rx="7"/>
    
    <!-- Sparkles -->
    <polygon points="450,180 460,200 480,210 460,220 450,240 440,220 420,210 440,200" fill="#FFD700"/>
    <polygon points="550,150 560,170 580,180 560,190 550,210 540,190 520,180 540,170" fill="#FFA500"/>
  </g>
</svg>