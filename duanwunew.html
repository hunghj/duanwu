<!DOCTYPE html><html lang="zh-SG"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>端午节知识挑战</title><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}body{background:linear-gradient(135deg,#022c22 0%,#065f46 50%,#047857 100%);display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden;color:#333}.bg-glow{position:absolute;width:150vw;height:150vw;background:radial-gradient(circle,rgba(251,191,36,.15) 0%,transparent 60%);top:-50vw;left:-25vw;z-index:0;animation:pulseGlow 8s infinite alternate;pointer-events:none}@keyframes pulseGlow{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.1);opacity:1}}#game-container{width:100%;max-width:480px;height:100%;position:relative;z-index:1;display:flex;flex-direction:column;overflow:hidden;background:0}.lanterns{position:absolute;top:0;width:100%;display:flex;justify-content:space-between;padding:0 30px;z-index:2;pointer-events:none}.lantern{width:80px;height:120px;filter:drop-shadow(0 5px 15px rgba(239,68,68,.5));transform-origin:top center;animation:swing 3s ease-in-out infinite alternate}.lantern:nth-child(2){animation-delay:1.5s}.lantern img{width:100%;height:100%;object-fit:contain}@keyframes swing{0%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;opacity:0;pointer-events:none;transition:all .5s cubic-bezier(.4,0,.2,1);transform:translateY(20px);z-index:10}.screen.active{opacity:1;pointer-events:auto;transform:translateY(0)}.glass-panel{background:rgba(255,255,255,.95);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:24px;padding:30px 20px;width:92%;max-width:400px;text-align:center;box-shadow:0 15px 35px rgba(0,0,0,.4),inset 0 0 0 1px rgba(251,191,36,.3);border:2px solid rgba(255,255,255,.8);margin-bottom:40px}.hero-image-container{width:100%;height:25vh;min-height:180px;max-height:250px;margin-bottom:20px;display:flex;justify-content:center;align-items:center}.hero-image{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 15px rgba(0,0,0,.1));animation:float 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}h1{font-size:28px;margin-bottom:10px;font-weight:900;background:linear-gradient(to right,#065f46,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent}p.subtitle{color:#4b5563;font-size:15px;margin-bottom:25px;line-height:1.5}.question-text{color:#111827;font-size:19px;font-weight:bold;margin-bottom:20px;line-height:1.4;text-align:left}.header-info{display:flex;justify-content:space-between;width:100%;margin-bottom:20px;color:#6b7280;font-size:14px;font-weight:bold}.score-badge{color:#059669;background:#dcfce7;padding:4px 12px;border-radius:20px}.btn-primary{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);color:#fff;border:none;padding:15px 30px;font-size:18px;font-weight:bold;border-radius:50px;cursor:pointer;width:100%;margin-top:10px;box-shadow:0 6px 20px rgba(217,119,6,.4);transition:transform .2s;text-shadow:0 1px 2px rgba(0,0,0,.2)}.btn-primary:active{transform:scale(.95)}.option-btn{background:#f8fafc;border:2px solid #e2e8f0;color:#334155;padding:15px;font-size:16px;font-weight:bold;border-radius:14px;cursor:pointer;width:100%;text-align:center;margin-bottom:12px;transition:all .2s ease}.option-btn:active{background:#e2e8f0;transform:scale(.98)}.option-btn.correct{background:#10b981;border-color:#059669;color:#fff;box-shadow:0 4px 15px rgba(16,185,129,.3)}.option-btn.wrong{background:#ef4444;border-color:#b91c1c;color:#fff}.option-btn:disabled{pointer-events:none}.hidden{display:none!important}.big-score{font-size:60px;color:#d97706;font-weight:900;margin:10px 0;text-shadow:2px 2px 0 rgba(251,191,36,.3)}.footer-banner{position:absolute;bottom:0;left:0;width:100%;background:rgba(2,44,34,.95);color:#fde047;text-align:center;padding:15px;font-weight:bold;font-size:15px;letter-spacing:2px;border-top:1px solid rgba(251,191,36,.3);z-index:20;padding-bottom:max(15px,env(safe-area-inset-bottom))}#custom-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .3s}#custom-modal-overlay.active{opacity:1;pointer-events:auto}.modal-box{background:#fff;width:85%;max-width:320px;border-radius:20px;padding:25px;text-align:center;transform:translateY(20px);transition:transform .3s}#custom-modal-overlay.active .modal-box{transform:translateY(0)}.modal-btn{background:#10b981;color:#fff;border:none;padding:12px 30px;border-radius:25px;font-size:16px;font-weight:bold;margin-top:20px;width:100%}#options-container{display:flex;flex-direction:column}</style></head><body><div class="bg-glow"></div><div id="game-container"><div class="lanterns"><div class="lantern"><img src="https://raw.githubusercontent.com/hunghj/newnew/main/dragon-zongzi.jpg" alt="龙舟" loading="lazy"></div><div class="lantern"><img src="https://raw.githubusercontent.com/hunghj/newnew/main/dragon-zongzi.jpg" alt="龙舟" loading="lazy"></div></div><div class="screen active" id="screen-welcome"><div class="glass-panel"><div class="hero-image-container"><img src="https://raw.githubusercontent.com/hunghj/newnew/main/dragon-zongzi.jpg" alt="龙舟竞赛" class="hero-image"></div><h1>端午节知识挑战</h1><p class="subtitle">看图答题目<br>测测你能否成为端午文化达人？</p><button class="btn-primary" onclick="startGame()">开始挑战</button></div></div><div class="screen" id="screen-quiz"><div class="glass-panel"><div class="header-info"><span id="q-counter">题目 1 / 5</span><span class="score-badge">得分: <span id="score">0</span></span></div><h2 class="question-text" id="question">题目加载中...</h2><div id="options-container"></div><button class="btn-primary hidden" id="next-btn" onclick="nextQuestion()" style="margin-top:15px;background:#10b981;box-shadow:0 4px 15px rgba(16,185,129,.4)">下一题</button></div></div><div class="screen" id="screen-result"><div class="glass-panel"><div class="hero-image-container" style="height:18vh;min-height:140px"><img src="https://raw.githubusercontent.com/hunghj/newnew/main/dragon-zongzi.jpg" alt="龙舟竞赛" class="hero-image"></div><h2 style="color:#065f46">挑战完成！</h2><div class="big-score" id="final-score">100</div><p class="subtitle" id="result-message" style="margin-bottom:20px">恭喜通关！</p><button class="btn-primary" onclick="restartGame()" style="margin-bottom:12px">再玩一次</button><button class="btn-primary" id="share-btn" onclick="shareToIG()" style="background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);box-shadow:0 4px 15px rgba(220,39,67,.4)">截图分享到 IG / FB</button></div></div><div class="footer-banner">祝大家端午安康</div></div><div id="custom-modal-overlay"><div class="modal-box"><h3 style="color:#d97706;margin-bottom:10px">📸 分享提示</h3><p style="color:#4b5563;font-size:15px;line-height:1.5">请使用手机自带的<b>截屏功能</b>，将您的满分成绩截图，然后发布到您的 Instagram Story 或 Facebook 动态中一起来挑战吧！</p><button class="modal-btn" onclick="closeModal()">我知道了</button></div></div><script>const quizData=[{question:"端午节是在农历的哪一天？",options:["正月初一","五月初五","八月十五","九月初九"],correctAnswer:1},{question:"端午节最具代表性的传统食物是什么？",options:["月饼","汤圆","粽子","年糕"],correctAnswer:2},{question:"端午节最著名的传统活动是什么？",options:["拜年","舞狮","放风筝","赛龙舟"],correctAnswer:3},{question:"端午节纪念的是哪位历史人物？",options:["孔子","曹操","屈原","郑和"],correctAnswer:2},{question:"端午节挂艾草和菖蒲有什么寓意？",options:["迎接新年","庆祝丰收","驱邪避疫","祈求考试顺利"],correctAnswer:2}];let currentQuestionIndex=0,score=0;const scorePerQuestion=20,screens=document.querySelectorAll(".screen"),qCounterEl=document.getElementById("q-counter"),scoreEl=document.getElementById("score"),questionEl=document.getElementById("question"),optionsContainer=document.getElementById("options-container"),nextBtn=document.getElementById("next-btn"),modalOverlay=document.getElementById("custom-modal-overlay");function showScreen(e){screens.forEach(t=>t.classList.remove("active")),document.getElementById(e).classList.add("active")}function startGame(){currentQuestionIndex=0,score=0,scoreEl.innerText=score,showScreen("screen-quiz"),loadQuestion()}function loadQuestion(){const e=quizData[currentQuestionIndex];qCounterEl.innerText=`题目 ${currentQuestionIndex+1} / ${quizData.length}`,questionEl.innerText=e.question,optionsContainer.innerHTML="",nextBtn.classList.add("hidden"),e.options.forEach((e,t)=>{const n=document.createElement("button");n.className="option-btn",n.innerText=e,n.onclick=()=>selectAnswer(t,n),optionsContainer.appendChild(n)})}function selectAnswer(e,t){const n=quizData[currentQuestionIndex],i=optionsContainer.querySelectorAll(".option-btn");i.forEach(e=>e.disabled=!0),e===n.correctAnswer?(t.classList.add("correct"),score+=scorePerQuestion,scoreEl.innerText=score):(t.classList.add("wrong"),i[n.correctAnswer].classList.add("correct")),nextBtn.classList.remove("hidden"),nextBtn.innerText=currentQuestionIndex===quizData.length-1?"查看结果":"下一题"}function nextQuestion(){currentQuestionIndex++,currentQuestionIndex<quizData.length?loadQuestion():showResults()}function showResults(){showScreen("screen-result"),document.getElementById("final-score").innerText=score;const e=document.getElementById("result-message");100===score?(e.innerText="太厉害了！满分端午达人！🏆",setTimeout(fireConfetti,300)):score>=60?e.innerText="不错哦！传统知识很丰富！👍":e.innerText="重在参与，顺便涨知识！✨"}function restartGame(){startGame()}async function shareToIG(){const e=document.querySelector("#screen-result .glass-panel"),t=document.getElementById("share-btn");if(!navigator.canShare||!navigator.canShare({files:[]}))return void modalOverlay.classList.add("active");try{if(t.innerText="正在生成专属成绩单...","undefined"==typeof html2canvas)return void modalOverlay.classList.add("active");const n=await html2canvas(e,{scale:2,useCORS:!0,backgroundColor:null});n.toBlob(async e=>{const a=new File([e],"duanwu-score.png",{type:"image/png"});try{await navigator.share({title:"端午节知识挑战",text:`我在端午节知识挑战中拿了 ${score} 分！你也来试试看吧！🏮`,files:[a]})}catch(e){"AbortError"!==e.name&&console.error("分享失败:",e)}t.innerText="截图分享到 IG / FB"})}catch(e){console.error("生成截图失败:",e),t.innerText="截图分享到 IG / FB",modalOverlay.classList.add("active")}}function closeModal(){modalOverlay.classList.remove("active")}function fireConfetti(){const e=3e3,t=Date.now()+e;!function n(){confetti({particleCount:5,angle:60,spread:55,origin:{x:0},colors:["#059669","#fbbf24","#ef4444"]}),confetti({particleCount:5,angle:120,spread:55,origin:{x:1},colors:["#059669","#fbbf24","#ef4444"]}),Date.now()<t&&requestAnimationFrame(n)}()}</script></body></html>
